services:

  emulator:
    image: us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2

    devices:
      - /dev/kvm:/dev/kvm

    volumes:
      - ${HOME}/.android/adbkey:/root/.android/adbkey:ro
      - ${HOME}/.android/adbkey.pub:/root/.android/adbkey.pub:ro

    ports:
      - "5555:5555"
      - "8554:8554"

    tmpfs:
      - /data


  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.toolbox

    depends_on:
      - emulator
  
    volumes:
      - .:/workspace
  
    working_dir: /workspace
  
    stdin_open: true
    tty: true
  
    command: sleep infinity